<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dc82" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#30363d" stroke-width="6"/>

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGrad)" stroke-width="8" stroke-dasharray="24 16" opacity="0.6" />

  <!-- Center Hexagonal Robot / Agent Shield -->
  <polygon points="256,120 380,190 380,330 256,400 132,330 132,190" fill="#1c2128" stroke="url(#neonGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Browser Window Header Bar Inside Shield -->
  <rect x="180" y="180" width="152" height="18" rx="6" fill="#30363d" />
  <circle cx="196" cy="189" r="4" fill="#ff5f56" />
  <circle cx="208" cy="189" r="4" fill="#ffbd2e" />
  <circle cx="220" cy="189" r="4" fill="#27c93f" />

  <!-- Autonomous Eyes / Sensors -->
  <circle cx="210" cy="250" r="16" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="302" cy="250" r="16" fill="#00e5ff" filter="url(#glow)"/>

  <!-- Lightning Bolt for Speed & Autonomy -->
  <path d="M265,220 L235,280 L260,280 L245,340 L285,270 L260,270 Z" fill="#00dc82" filter="url(#glow)"/>
</svg>
