<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous Fast Browser Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Suppress Chromium Windows WebGPU powerPreference warning (crbug.com/369219127)
      try {
        if (typeof navigator !== 'undefined' && navigator.gpu && navigator.gpu.requestAdapter) {
          const originalRequestAdapter = navigator.gpu.requestAdapter.bind(navigator.gpu);
          navigator.gpu.requestAdapter = function(options) {
            if (options && 'powerPreference' in options) {
              const { powerPreference, ...rest } = options;
              return originalRequestAdapter(rest);
            }
            return originalRequestAdapter(options);
          };
        }
        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('crbug.com/369219127') || args[0].includes('powerPreference option is currently ignored'))) {
            return;
          }
          originalWarn.apply(console, args);
        };
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#09090b] text-zinc-100 min-h-screen antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
